<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>한민고 시간표</title>
<style>
  :root{
    --ink:#181a21; --ink-2:#484d5b; --ink-3:#797f8e;
    --paper:#f6f5f2; --card:#fff; --line:#e3e0da; --now:#4338ca; --now-soft:#ecebfb;
  }
  @media (prefers-color-scheme:dark){
    :root{--ink:#edeff4; --ink-2:#a9aeba; --ink-3:#828896;
          --paper:#111217; --card:#191b21; --line:#2b2e37; --now:#a29bff; --now-soft:#232244}
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:grid; place-items:center; padding:32px;
    background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",
      "Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
    line-height:1.65;
  }
  main{max-width:440px; text-align:center}
  .badge{
    display:inline-block; font-size:11.5px; font-weight:800; letter-spacing:.14em;
    color:var(--now); background:var(--now-soft); border-radius:999px; padding:5px 13px;
  }
  h1{margin:18px 0 10px; font-size:27px; font-weight:800; letter-spacing:-.02em}
  p{margin:0 0 8px; color:var(--ink-2); font-size:15px}
  .small{margin-top:20px; font-size:12.5px; color:var(--ink-3)}
</style>
</head>
<body>
<main>
  <span class="badge">준비 중</span>
  <h1>한민고 학생 시간표</h1>
  <p>내 시간표와 급식을 보고, 보강·교체가 생기면 그 자리에서 바뀝니다.</p>
  <p>아직 열지 않았습니다. 열리면 학교에서 안내합니다.</p>
  <p class="small">한민고등학교</p>
</main>
</body>
</html>
